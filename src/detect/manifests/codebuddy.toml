id = "codebuddy"
version = "2026.07.09.4"
min_engine_version = 2
updated_at = "2026-07-09T00:00:00Z"
aliases = ["cbc"]

# Evidence: CodeBuddy Code v2.117.2 captured in a 100x30 tmux PTY with
# CODEBUDDY_API_KEY and CODEBUDDY_BASE_URL pointed at a local mock endpoint.
# The idle footer renders a prompt box with an ASCII input marker:
#
#   ───────────────────────────────────────────────────────────────────────
#   >
#   ───────────────────────────────────────────────────────────────────────
#   ? for shortcuts
#
# Inside the prompt_box_body region the invariant live idle control is the
# prompt marker, ">", not Claude's "❯". The stock "? for shortcuts" banner is
# outside this region and can share its line with optional status chips.
#
# Blocked evidence from captured trust.txt and permission.txt fixtures:
#
#   Do you trust the files in this folder?
#     1. Trust folder only (case-073-codebuddy-blocked)
#     4. No, exit (escape)
#   Enter to confirm • Esc to exit
#
#   Bash command
#   Do you want to proceed?
#     1. Yes
#     2. Yes, and don't ask again for session (shift + tab)
#     3. No, and tell CodeBuddy what to do differently (escape)
#
# Working and skip evidence from captured working.txt, working-osc-title.txt,
# model-picker.txt, model-picker-session.txt, and transcript-viewer.txt fixtures:
#
#   ⠙ Run permission command
#   ✶ Waking… (0s · preparing · ↑ 0 tokens · esc to interrupt)
#
#   Select Model   Global   Session  (tab to switch)
#   Select a model for all future sessions.
#   Enter to confirm · Tab to switch scope · Esc to exit
#
#   Select Model  Global   Session   (tab to switch)
#   Switch model for this session only (won't persist).
#   Enter to confirm · Tab to switch scope · Esc to exit
#
#   Showing detailed transcript · ctrl+o to toggle
#
# CodeBuddy can keep a braille OSC title while a permission prompt is visible,
# so explicit blockers rank above working even though the OSC rule is still the
# preferred working signal when no live blocker is on screen.

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["showing detailed transcript", "ctrl+o to toggle"]

[[rules]]
id = "model_picker_menu"
state = "unknown"
priority = 990
region = "whole_recent"
skip_state_update = true
contains = [
  "select model",
]
any = [
  { contains = ["tab to switch"] },
  { contains = ["enter to confirm"] },
  { contains = ["esc to exit"] },
]

[[rules]]
id = "workspace_trust_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = [
  "do you trust the files in this folder?",
  "enter to confirm • esc to exit",
]
any = [
  { line_regex = ['(?i)^\s*│?\s*>?\s*1\.\s*Trust folder only\b'] },
  { line_regex = ['(?i)^\s*│?\s*>?\s*4\.\s*No, exit\b'] },
]

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 970
region = "whole_recent"
visible_blocker = true
contains = [
  "bash command",
  "do you want to proceed?",
]
any = [
  { line_regex = ['(?i)^\s*│?\s*>?\s*1\.\s*Yes\b'] },
  { line_regex = ['(?i)^\s*│?\s*>?\s*2\.\s*Yes\b'] },
  { line_regex = ['(?i)^\s*│?\s*>?\s*3\.\s*No\b'] },
]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 960
region = "osc_title"
visible_working = true
regex = ['^[\x{2800}-\x{28FF}] ']

[[rules]]
id = "visible_working"
state = "working"
priority = 960
region = "bottom_non_empty_lines(8)"
visible_working = true
contains = ["esc to interrupt"]
any = [
  { contains = ["thinking..."] },
  { contains = ["waking"] },
]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*>']
not = [
  { contains = ["enter to confirm"] },
  { contains = ["esc to exit"] },
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["esc to interrupt"] },
]
